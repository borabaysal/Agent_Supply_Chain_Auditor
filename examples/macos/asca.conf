# asca settings for scripts/macos/asca-run.sh and install-launchd.sh.
# Copy to ~/.config/asca/asca.conf and edit. Plain shell variables; no secrets in this file
# (the Telegram token goes in ~/.config/asca/telegram.env).

# Name shown in alerts (default: the Mac's Computer Name)
ASCA_HOST_LABEL="macbook"

# Folders that contain your git repos and Python virtualenvs, space-separated, no spaces in paths.
ASCA_REPOS="$HOME/Projects"

# Which jobs to schedule, and when (24h, local time). If the Mac is asleep, launchd runs a
# missed job once when it wakes.
ASCA_JOBS="audit skills inventory"
ASCA_TIME_audit=08:00
ASCA_TIME_skills=08:10
ASCA_TIME_inventory=08:15

# Telegram mode for scheduled runs: change (alert only when something changes), fail, always, never
ASCA_TELEGRAM=change

# Optional: a specific Python (needs 3.11+). Default: Homebrew's python3.
# ASCA_PYTHON=/opt/homebrew/bin/python3

# Optional extra flags per job, e.g. a smaller session-history budget on a busy laptop:
# ASCA_AUDIT_ARGS="--session-budget-mb 512 --online-advisories"
# ASCA_SKILLS_ARGS="--gate default"
# ASCA_INVENTORY_ARGS="--item-cap-mb 32"
