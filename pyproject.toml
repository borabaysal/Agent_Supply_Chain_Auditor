[project]
name = "agent-supply-chain-auditor"
version = "0.5.0"
description = "Find the API keys, unpinned MCP servers and risky settings your AI agents left on your machine, in one command."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# stdlib only, on purpose: an auditor of supply-chain risk should not add any.
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
asca = "asca.cli:main"
asca-egress = "asca.egress.cli:main"
asca-fleet = "asca.fleet.cli:main"
asca-skills = "asca.skillscan.cli:main"
asca-inventory = "asca.inventory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["asca", "asca.egress", "asca.fleet", "asca.skillscan", "asca.inventory"]

[tool.setuptools.package-data]
"asca.skillscan" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
